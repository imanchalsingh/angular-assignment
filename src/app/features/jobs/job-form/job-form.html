<div class="job-form-container">
  <h1>{{ isEditMode ? 'Edit Job' : 'Add New Job' }}</h1>

  <form [formGroup]="jobForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="form-group">
        <label>Company</label>
        <input type="text" formControlName="company" />
      </div>

      <div class="form-group">
        <label>Position</label>
        <input type="text" formControlName="position" />
      </div>

      <div class="form-group">
        <label>Status</label>
        <select formControlName="status">
          <option *ngFor="let status of statusOptions" [value]="status">
            {{ status }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Job Type</label>
        <select formControlName="jobType">
          <option *ngFor="let type of jobTypeOptions" [value]="type">
            {{ type }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Location</label>
        <input type="text" formControlName="location" />
      </div>

      <div class="form-group">
        <label>Salary</label>
        <input type="text" formControlName="salary" />
      </div>

      <div class="form-group">
        <label>Applied Date</label>
        <input type="date" formControlName="appliedDate" />
      </div>

      <div class="form-group full-width">
        <label>Notes</label>
        <textarea rows="4" formControlName="notes"></textarea>
      </div>
    </div>

    <button type="submit" [disabled]="jobForm.invalid">
      {{ isEditMode ? 'Update Job' : 'Add Job' }}
    </button>
  </form>
</div>
